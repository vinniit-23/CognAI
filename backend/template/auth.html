<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CognAI Descope Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 450px;
        padding: 40px;
        text-align: center;
        transition: transform 0.3s ease;
      }

      .container:hover {
        transform: translateY(-5px);
      }

      .logo {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #664caf, #45a049);
        border-radius: 50%;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .logo i {
        font-size: 40px;
        color: white;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-weight: 700;
        font-size: 28px;
      }

      h3 {
        color: #664caf;
        margin-bottom: 30px;
        font-weight: 500;
        font-size: 18px;
      }

      .description {
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      button {
        background: linear-gradient(to right, #664caf, #5a3f9c);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        width: 100%;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(102, 76, 175, 0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      button:hover {
        background: linear-gradient(to right, #5a3f9c, #4e3585);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 76, 175, 0.6);
      }

      button:active {
        transform: translateY(0);
      }

      .features {
        display: flex;
        justify-content: space-around;
        margin-top: 30px;
      }

      .feature {
        text-align: center;
        max-width: 120px;
      }

      .feature i {
        font-size: 24px;
        color: #664caf;
        margin-bottom: 10px;
      }

      .feature p {
        font-size: 14px;
        color: #666;
      }

      .footer {
        margin-top: 30px;
        color: #888;
        font-size: 12px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 30px 20px;
        }

        .features {
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <i class="fas fa-brain"></i>
      </div>

      <h1>Welcome to CognAI</h1>
      <h3>Sign in with Descope</h3>

      <p class="description">
        Connect your Gmail account to get started with CognAI's powerful email
        assistance features.
      </p>

      <button id="connect-btn">
        <i class="fab fa-google"></i>
        Sign in / Connect Gmail
      </button>

      <div class="features">
        <div class="feature">
          <i class="fas fa-shield-alt"></i>
          <p>Secure Login</p>
        </div>
        <div class="feature">
          <i class="fas fa-bolt"></i>
          <p>Instant Setup</p>
        </div>
        <div class="feature">
          <i class="fas fa-lock"></i>
          <p>Privacy First</p>
        </div>
      </div>

      <p class="footer">
        By continuing, you agree to our Terms of Service and Privacy Policy
      </p>
    </div>

    <script type="module">
      import { DescopeSDK } from "https://unpkg.com/@descope/web-js-sdk/dist/index.min.js";
      const sdk = new DescopeSDK({ projectId: "P32EHcSUyAcPfyTjmoJFRE1MuwEa" });
      document.getElementById("connect-btn").onclick = async () => {
        const result = await sdk.flows.start("connect-gmail", {
          redirectURL: window.location.href,
        });
      };
      if (window.location.search.includes("?code=")) {
        const session = await sdk.getSession();
        const refreshJwt = session?.refreshJwt;
        const userId = session?.user?.userId;
        await fetch("http://localhost:8000/store_refresh", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refreshJwt, userId }),
        });
        alert("Connected! You can close this tab and return to the app.");
      }
    </script>
  </body>
</html>
